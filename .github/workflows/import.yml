name: SysML import corpus
on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.java'
      - 'requirements.txt'
      - 'research/cases/**'
      - 'research/corpus-pins.json'
      - '.github/workflows/import.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: Systems-Modeling/SysML-v2-Pilot-Implementation
          ref: 801c6a881954987a9707d396d5767db1ec51d8cb
          path: _external/pilot
          sparse-checkout: sysml.library
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Systems-Modeling/SysML-v2-Pilot-Implementation
          ref: 801c6a881954987a9707d396d5767db1ec51d8cb
          path: _external/pilot-src
          sparse-checkout: sysml/src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: airbus/apollo-11-sysml-v2
          ref: 6e9c93fe7d80c5ca3534bb14b10ab374a643ef2d
          path: _external/apollo11
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sensmetry/advent-of-sysml-v2
          ref: 83ba1f692072c9dffd7cdf873e11ae1e4a4f833f
          path: _external/advent
          persist-credentials: false
      - name: Download the released official frontend wrapper
        run: |
          curl --fail --location --retry 3 -o _external/pilot.jar https://github.com/HansBug/sysml-v2-pilot-gt/releases/download/v0.1.0/sysml-v2-pilot-gt-0.1.0-all.jar
          echo '1bb02b3865e6830687f4c4f80afbfe8d670f6fb6df305f6844833543320fa989  _external/pilot.jar' | sha256sum --check
      - run: pip install -r requirements.txt
      - run: python prepare_corpus.py
      - name: Extract linked elements with the official Pilot
        run: java -Xmx4g -cp _external/pilot.jar ExtractStates.java _external/pilot/sysml.library artifacts/corpus-manifest.json artifacts/corpus-source.json > artifacts/extraction.log 2>&1
      - run: python check_import.py artifacts/corpus-source.json
      - name: Compile project-context and inventory probes
        run: |
          mkdir -p artifacts/audit-classes
          javac -cp _external/pilot.jar -d artifacts/audit-classes ExtractStates.java ExtractProject.java research/SysmlStateInventory.java
      - name: Count typed states before validation filtering
        run: |
          java -Xmx3g -cp _external/pilot.jar:artifacts/audit-classes SysmlStateInventory \
            artifacts/corpus-manifest.json artifacts/syntax-state-inventory.json artifacts/corpus-source.json
          python research/register_state_assets.py artifacts/syntax-state-inventory.json artifacts/state-assets.json artifacts/state-assets.zh.md
      - name: Index and extract one public project with companion files
        run: |
          java -Xmx3g -cp _external/pilot.jar:artifacts/audit-classes ExtractProject \
            _external/pilot/sysml.library '_external/benchmark/data/examples/Interaction Sequencing Examples' artifacts/project-context.json
      - name: Convert project state roots through pyfcstm
        run: python research/convert_project_results.py artifacts/project-context.json artifacts/project-conversion.json
      - name: Scan every registered project context
        run: |
          python research/run_project_contexts.py \
            --assets artifacts/state-assets.json \
            --root gfse=_external/gfse/models \
            --root systemp=_external/benchmark/data \
            --root refinement_positive='_external/refinement/Open-Source Dataset Release/604 positive artifacts' \
            --root refinement_negative='_external/refinement/Open-Source Dataset Release/439 negative artifacts' \
            --root official_pilot=_external/pilot-src/sysml/src \
            --root apollo11=_external/apollo11 \
            --root advent=_external/advent \
            --root book_examples=_external/book_examples \
            --project-root advent=_external/advent \
            --project-root apollo11=_external/apollo11 \
            --project-root book_examples=_external/book_examples \
            --library _external/pilot/sysml.library --jar _external/pilot.jar \
            --output artifacts/project-contexts
          python research/convert_project_results.py artifacts/project-contexts artifacts/project-context-conversion.json
      - run: python convert_corpus.py artifacts/corpus-source.json artifacts/converted
      - name: 核对逐根登记与源状态树
        run: python research/check_conversion_reports.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sysml-import-evidence
          path: artifacts/
          if-no-files-found: error
